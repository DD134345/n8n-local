services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    build: .
    # Check the Code-node external-module mechanism when upgrading this pinned version.
    extra_hosts:
      - "winhost:${WIN_HOST_IP}"
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${VM_IP}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://${VM_IP}:5678/
      - N8N_EDITOR_BASE_URL=http://${VM_IP}:5678/
      - N8N_SECURE_COOKIE=false
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=3
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
      - NODE_FUNCTION_ALLOW_EXTERNAL=turndown,turndown-plugin-gfm,js-yaml
      # Workflow Z reads $env.ZALO_BOT_TOKEN; flip to true once it uses a credential instead.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - TZ=Asia/Ho_Chi_Minh
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - ZALO_BOT_TOKEN=${ZALO_BOT_TOKEN:-}
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
    volumes:
      - n8n_data:/home/node/.n8n
      - ${WORKFLOWS_IMPORT_DIR:-./import}:/import:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
